[package]
name = "lb-experiments"
version = "0.1.0"
edition = "2021"
description = "Load balancing in parallel computing: no-dependency Rust experiment suite"

[dependencies]

[lib]
name = "lbe"
path = "src/lib.rs"

[[bin]]
name = "lb"
path = "src/main.rs"

[[bin]]
name = "mandelbrot"
path = "src/bin/mandelbrot.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
